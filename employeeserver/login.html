<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FabClean Employee Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Electrolize&display=swap" rel="stylesheet">
    <style>
        /* Custom Colors based on your UI design */
        :root {
            --light-green: #C8E6C9; /* Primary left panel background */
            --mild-orange: #FFCCBC; /* Accent for links/focus */
            --dark-grey-text: #424242; /* Main text color */
            --off-white-bg: #F5F5F5; /* Right panel background */
            --button-green: #8BC34A; /* Stronger green for button */
            --button-green-hover: #9CCC65; /* Lighter green for button hover */
            --input-border-green: #A5D6A7; /* Slightly darker green for input borders */
            --input-placeholder: #A0A0A0; /* Light grey for placeholders */
            --subtle-shadow: rgba(0, 0, 0, 0.1); /* Soft shadow for card */
        }

        body {
            font-family: 'Electrolize', sans-serif;
            background-color: var(--light-green); /* Full screen light green background */
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: var(--dark-grey-text); /* Default text color for body */
            margin: 0;
        }

        .login-container {
            display: flex; /* Makes left and right panels side-by-side */
            width: 800px; /* Adjust total width as needed */
            max-width: 90vw; /* Responsive max width */
            border-radius: 1.5rem; /* Rounded corners for entire container */
            overflow: hidden; /* Ensures rounded corners clip content */
            box-shadow: 0 10px 30px var(--subtle-shadow); /* Soft shadow */
        }

        .left-panel {
            flex: 1;
            background-color: var(--light-green);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            position: relative; /* For decorative elements */
            overflow: hidden;
        }

        /* Decorative background elements for left panel (subtle version) */
        .left-panel::before, .left-panel::after {
            content: '';
            position: absolute;
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }
        .left-panel::before { /* Larger bubble */
            width: 150px; height: 150px;
            top: -50px; left: -50px;
        }
        .left-panel::after { /* Smaller bubble */
            width: 80px; height: 80px;
            bottom: -30px; right: -30px;
        }

        .right-panel {
            flex: 1;
            background-color: var(--off-white-bg);
            padding: 2.5rem; /* Slightly more padding for form side */
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        input {
            background-color: white !important; /* White background for inputs */
            border-color: var(--input-border-green) !important;
            color: var(--dark-grey-text) !important;
            padding-left: 3rem !important; /* Space for icons */
        }
        input::placeholder {
            color: var(--input-placeholder) !important;
        }
        input:focus {
            border-color: var(--mild-orange) !important;
            box-shadow: 0 0 0 3px rgba(255, 204, 188, 0.5) !important; /* Orange glow */
        }

        .login-btn {
            background: var(--button-green);
            color: white; /* White text on green button */
            border: none;
            font-weight: bold;
            letter-spacing: normal; /* Remove letter-spacing for cleaner look */
            text-transform: none; /* Remove uppercase */
            position: relative;
            overflow: hidden;
            transition: background-color 0.3s ease-in-out;
        }
        .login-btn:hover {
            background-color: var(--button-green-hover);
            transform: translateY(-2px); /* Slight lift on hover */
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        .login-btn::before {
             /* Remove glow effect from original button */
             content: none;
        }

        /* SVG Icon styling */
        .input-icon {
            position: absolute;
            left: 1rem; /* Adjust icon position */
            top: 50%;
            transform: translateY(-50%);
            color: var(--input-placeholder); /* Icon color */
        }

        /* Washer Icon SVG */
        .washer-icon {
            width: 100px; /* Adjust size */
            height: 100px;
            margin-bottom: 1.5rem;
        }
        .washer-icon .body {
            stroke: var(--dark-grey-text);
            fill: none;
            stroke-width: 3;
        }
        .washer-icon .door {
            stroke: var(--dark-grey-text);
            fill: none;
            stroke-width: 3;
        }
        .washer-icon .shirt {
            fill: var(--off-white-bg); /* Use off-white for shirt inside */
            stroke: var(--dark-grey-text);
            stroke-width: 1;
        }
        .washer-icon .controls circle, .washer-icon .controls line {
            fill: var(--dark-grey-text);
            stroke: var(--dark-grey-text);
            stroke-width: 1.5;
        }
        .washer-icon .controls line {
            fill: none;
        }

        .loading {
            opacity: 0.6;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="left-panel">
            <svg class="washer-icon" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect class="body" x="20" y="20" width="160" height="160" rx="15" ry="15" />
                <circle class="door" cx="100" cy="90" r="50" />
                <path class="shirt" d="M90 75 L110 75 L115 85 L100 100 L85 85 L90 75 Z" />
                <g class="controls">
                    <circle cx="50" cy="50" r="7" />
                    <circle cx="70" cy="50" r="7" />
                    <circle cx="90" cy="50" r="7" />
                    <circle cx="120" cy="50" r="10" />
                    <line x1="120" y1="45" x2="120" y2="40" />
                </g>
            </svg>
            <h2 class="text-4xl font-bold text-dark-grey-text tracking-normal">FabClean Employee</h2>
        </div>

        <div class="right-panel">
            <h2 class="text-3xl font-bold text-dark-grey-text mb-8 text-center">Employee Login</h2>
            <form id="loginForm" class="space-y-6">
                <div>
                    <label for="email" class="block text-sm font-semibold text-gray-700 mb-1">EMAIL</label>
                    <div class="relative">
                        <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                            <path d="M5.52 19c.75-2.85 2.6-5 4.48-5h.5c.67 0 1.25.13 1.8.45M16 7a4 4 0 11-8 0 4 4 0 018 0zM19 14v6M22 17h-6" />
                        </svg>
                        <input id="email" name="email" type="email" autocomplete="email" required 
                               placeholder="Enter your email"
                               class="w-full px-5 py-3 border rounded-xl shadow-sm">
                    </div>
                </div>

                <div>
                    <label for="password" class="block text-sm font-semibold text-gray-700 mb-1">PASSWORD</label>
                    <div class="relative">
                        <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                        <input id="password" name="password" type="password" autocomplete="current-password" required 
                               placeholder="Enter your password"
                               class="w-full px-5 py-3 border rounded-xl shadow-sm">
                    </div>
                </div>
                
                <div id="errorMessage" class="hidden text-sm text-red-700 font-medium text-center bg-red-100 rounded-lg p-3 border border-red-300"></div>

                <div>
                    <button type="submit" class="w-full flex justify-center py-3 px-4 rounded-xl shadow-lg login-btn">
                        <span class="z-10 relative">LOGIN TO DASHBOARD</span>
                    </button>
                </div>
            </form>
            <p class="mt-6 text-xs text-center text-gray-500">
                Contact support if you have issues.
            </p>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(event) {
            event.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMessageDiv = document.getElementById('errorMessage');
            const submitBtn = event.target.querySelector('button[type="submit"]');
            
            // Show loading state
            submitBtn.classList.add('loading');
            submitBtn.innerHTML = '<span class="z-10 relative">LOGGING IN...</span>';
            errorMessageDiv.classList.add('hidden');

            try {
                const response = await fetch('/employee/login', { 
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, password }),
                });

                const data = await response.json();

                if (response.ok) {
                    // Store token and user info
                    localStorage.setItem('fab-employee-token', data.token);
                    localStorage.setItem('fab-employee-worker', JSON.stringify(data.worker));
                    
                    // Set token as cookie for server-side auth
                    document.cookie = `fab-employee-token=${data.token}; path=/; max-age=86400`;
                    
                    // Redirect to main app
                    window.location.href = '/';
                } else {
                    errorMessageDiv.textContent = data.error || 'Authentication failed.';
                    errorMessageDiv.classList.remove('hidden');
                }
            } catch (error) {
                errorMessageDiv.textContent = 'An error occurred. Please try again.';
                errorMessageDiv.classList.remove('hidden');
            } finally {
                // Remove loading state
                submitBtn.classList.remove('loading');
                submitBtn.innerHTML = '<span class="z-10 relative">LOGIN TO DASHBOARD</span>';
            }
        });
    </script>
</body>
</html>
